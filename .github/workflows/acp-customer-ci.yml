name: ACP customer CI — real pass or block
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [safe, authority-deny, incident-fixed, incident-regression, approval, missing-trace, malformed-trace, empty-trace]
    defaults:
      run:
        working-directory: agent-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install customer test dependency and exact ACP revision
        run: |
          python -m pip install pytest
          python -m pip install "git+https://github.com/myfastcat/ACP.git@1d8690a59e42f4aa14951e309ec32ef8b9e194bd"
      - name: Customer initializes authority, config and CI from existing tools
        run: |
          acp init . --ci --test-command 'python -m pytest -q'
          test -f .acp/authority.json
          test -f .acp/config.json
          test -f .github/workflows/acp.yml
          test -d .acp/incidents
          test -z "$(find .acp/incidents -type f -print -quit)"
          mkdir -p evidence
          cp .acp/authority.json evidence/draft-authority.json
          cp .github/workflows/acp.yml evidence/generated-acp.yml
          cp customer-policy.json .acp/authority.json
          acp validate .acp/authority.json
      - name: Customer supplies historical duplicate-email trace and chooses invariant
        run: |
          acp incident import incidents/raw-duplicate-email.json --incident-id INC-DUPLICATE-EMAIL
          acp incident assert .acp/incidents/INC-DUPLICATE-EMAIL.json --max-occurrences send_email --max 1
          acp incident assert .acp/incidents/INC-DUPLICATE-EMAIL.json --must-occur lookup_customer
          acp incident assert .acp/incidents/INC-DUPLICATE-EMAIL.json --must-not-occur delete_customer
      - name: Run the existing customer tests through the generated CI capture command
        env:
          DEMO_VIOLATION: ${{ matrix.case == 'authority-deny' && '1' || '0' }}
          DEMO_REGRESSION: ${{ matrix.case == 'incident-regression' && '1' || '0' }}
        run: python -m agent_control_plane.zero_code_runner -- sh -c 'python -m pytest -q'
      - name: Model approval and input-failure cases
        env:
          CUSTOMER_CASE: ${{ matrix.case }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          case = os.environ['CUSTOMER_CASE']
          trace = Path('.acp/traces/customer-support.json')
          if case == 'approval':
              events = json.loads(trace.read_text())
              events.append({'action': 'update_customer', 'context': {}})
              trace.write_text(json.dumps(events))
          elif case == 'missing-trace':
              trace.unlink()
          elif case == 'malformed-trace':
              Path('.acp/traces/broken.json').write_text('{broken')
          elif case == 'empty-trace':
              trace.write_text('[]')
          PY
      - name: ACP customer gate — nonzero exit fails this job
        run: |
          set +e
          acp check --config .acp/config.json --json > evidence/check.json 2> evidence/check.stderr
          status=$?
          set -e
          echo "$status" > evidence/exit-code.txt
          cat evidence/check.json evidence/check.stderr
          exit "$status"
      - name: Show customer result
        if: always()
        env:
          CUSTOMER_CASE: ${{ matrix.case }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          case = os.environ['CUSTOMER_CASE']
          actual_file = Path('evidence/exit-code.txt')
          actual = actual_file.read_text().strip() if actual_file.exists() else 'not reached'
          verdict = {'0': 'PASS', '2': 'BLOCK', '3': 'APPROVAL — blocked', '4': 'ERROR — no safety verdict'}.get(actual, 'SETUP/TEST FAILURE')
          text = f"### {case}: {verdict}\n\nActual ACP exit: **{actual}**. Exit 0 is green; exits 2/3/4 fail this customer job.\n\n"
          report_file = Path('evidence/check.json')
          if report_file.exists() and report_file.read_text().strip():
              report = json.loads(report_file.read_text())
              s = report['summary']
              text += f"Events: **{s['events']}** · DENY: **{s['counts']['DENY']}** · Incident failures: **{s['incident_failures']}** · ci_pass: **{s['ci_pass']}**\n\n"
              for incident in report['incidents']:
                  for failure in incident['failures']:
                      text += f"- {failure}\n"
          error_file = Path('evidence/check.stderr')
          if error_file.exists() and error_file.read_text().strip():
              text += "\n" + error_file.read_text() + "\n"
          text += f"\nEvidence: download the **real-customer-{case}** artifact. This job preserves the real ACP exit. BLOCK and ERROR are red in GitHub Actions.\n"
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(text)
          print(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-customer-${{ matrix.case }}
          include-hidden-files: true
          path: |
            agent-control-plane/evidence/
            agent-control-plane/.acp/
